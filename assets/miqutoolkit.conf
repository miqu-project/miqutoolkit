# ==============================================================================
# miqutoolkit Global Configuration
# Authoritative System Fallback (Dead End Authority)
# Unified styling, typography, metrics, and colors for all miqu* applications
# ==============================================================================

# --- Appearance & Metrics ---
font = Sans
font_size = 11
h1_size = 20
h2_size = 15
h3_size = 13
caption_size = 10
icon_theme = papirus
corner_radius = 12
border_width = 1
# Card ambient shadow elevation (floating-point supported, e.g. 0.5 for subtle micro-shadow, 2.0 default, 0 to disable)
card_elevation = 2.0
# --- Default Colors (Fallback Dead End) ---
# You can source a file containing color definitions or override them in ~/.config/miqutoolkit/miqutoolkit.conf.
# Do not edit this file inside /usr/share/miqutoolkit/.

background = #fff7fc80
on_background = #201923
surface = #fff7fc80
on_surface = #000000
surface_variant = #ebdfed
on_surface_variant = #312a35
primary = #540081
on_primary = #ffffff
primary_container = #9b00ea
on_primary_container = #ffffff
outline = #d8ccd9
outline_variant = #e4d7e5
backdrop = #00000080
