# ==============================================================================
# miqutoolkit Global Configuration
# Unified styling, typography, metrics, and colors for all miqu* applications
# ==============================================================================

# ==============================================================================
# 1. Appearance & Metrics
# ==============================================================================
font = Sans
font_size = 11
h1_size = 20
h2_size = 15
h3_size = 13
caption_size = 10
icon_theme = papirus
corner_radius = 18
border_width = 1

# Card ambient shadow elevation (0 to disable, 2.0 default)
card_elevation = 1.0

# Tooltip background opacity (0-100 percentage or 0.0-1.0 float, 90 default)
tooltip_opacity = 90

# Tooltip ambient shadow elevation (0 to disable, 1.5 default)
tooltip_elevation = 1.5

# ==============================================================================
# 2. Dynamic Theme Integration (miqutheme)
# ==============================================================================
# 3. Default Color Palette
# ==============================================================================
# Active fallback colors. If 'source' above is enabled, sourced colors override these.
background = #fff7fc80
on_background = #201923
surface = #fff7fc80
on_surface = #000000
surface_variant = #ebdfed
on_surface_variant = #312a35
primary = #540081
on_primary = #ffffff
primary_container = #9b00ea
on_primary_container = #ffffff
outline = #d8ccd9
outline_variant = #e4d7e5
backdrop = #00000080

# ==============================================================================
# To dynamically synchronize colors with wallpapers and miqutheme, uncomment (remove the hash) before the line containing "source").
# If you are into ricing, go ahead, generate template of above style from matugen/color scheme and point the source to it.


# source = ~/.config/miqutheme/current/miqutoolkit.conf


